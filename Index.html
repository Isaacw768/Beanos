<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Words – a course in talking to women</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#14233a;--mute:#5c6b80;--line:#d5deea;--pri:#2f5bea;--priD:#2447bd;--gold:#f2b01e;--ok:#2e9e6b;--okBg:#e3f5ec;--lock:#e4e9f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1826;--card:#18253a;--ink:#e8eef8;--mute:#9aabc2;--line:#2b3b55;--pri:#6b8cff;--priD:#8aa4ff;--ok:#4cc790;--okBg:#173a2e;--lock:#1f2e45}}
:root[data-theme="dark"]{--bg:#0f1826;--card:#18253a;--ink:#e8eef8;--mute:#9aabc2;--line:#2b3b55;--pri:#6b8cff;--priD:#8aa4ff;--ok:#4cc790;--okBg:#173a2e;--lock:#1f2e45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Manrope,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Manrope,sans-serif;line-height:1.15;margin:0 0 .5em}
h1{font-size:2.1rem;font-weight:800}h2{font-size:1.5rem;font-weight:800}h3{font-size:1.1rem;font-weight:600}
p{margin:0 0 1em}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:700}
.btn:hover:not(:disabled){background:var(--priD)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--pri);border:2px solid var(--pri)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=text],input[type=password],input[type=email],textarea{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
label{display:block;font-weight:600;margin:12px 0 4px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.opt:hover{border-color:var(--pri)}.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.opt.right{border-color:var(--ok);background:var(--okBg)}.opt.wrong{border-color:#d4493e}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.prog{height:10px;background:var(--lock);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--pri);transition:width .4s}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:18px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:10px;border-radius:10px;font-weight:700}
.tabs button.on{background:var(--pri);color:#fff}
.stars{color:var(--gold);font-weight:700;white-space:nowrap}
.lesson{display:block;width:100%;text-align:left;color:var(--ink)}
.lesson.cur{border:2px solid var(--pri)}.lesson.locked{background:var(--lock);color:var(--mute);cursor:default}
.lesson.cur,.lesson.done{cursor:pointer}
.chip{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--lock);color:var(--mute)}
.chip.now{background:var(--pri);color:#fff}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zone{min-height:140px;border:2px dashed var(--line);border-radius:14px;padding:8px}
.zone.str{border-color:var(--ok)}.zone.weak{border-color:#d4493e}
.zone h3{font-size:1rem;margin:4px 4px 8px}
.pill{display:inline-block;background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 12px;margin:3px;font-size:.92rem;cursor:grab}
.pill.picked{border-color:var(--pri)}
.bank{display:flex;flex-wrap:wrap;margin:10px 0}
.row{display:flex;align-items:center;gap:8px}.row .opt{margin:5px 0;flex:1}
.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;width:34px;height:34px}
.chat{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.b{max-width:80%;padding:10px 14px;border-radius:18px}
.b.ai{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.b.me{background:var(--pri);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.fb{background:var(--okBg);border-radius:12px;padding:14px;margin:12px 0}
.task{display:flex;gap:12px;align-items:center;width:100%;text-align:left;color:var(--ink)}
.task .d{flex:none;width:38px;height:38px;border-radius:50%;background:var(--pri);color:#fff;font-weight:800;display:grid;place-items:center}
.task.done{opacity:.5;cursor:default}.task.done .d{background:var(--mute)}
.hero{background:var(--pri);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px}
.hero .prog{background:rgba(255,255,255,.3)}.hero .prog i{background:var(--gold)}
.star-in{display:inline-flex;font-size:2.2rem;color:var(--gold)}
.star-in span{position:relative;display:inline-block;width:1em;line-height:1}
.star-in span b{position:absolute;top:0;width:50%;height:100%;cursor:pointer}
.star-in .l{left:0}.star-in .r{right:0}
.muted{color:var(--mute);font-size:.92rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="wrap" id="app"></div>
<script>
const LESSONS=[
{id:1,title:"Small talk that goes somewhere",over:"Open a conversation, keep it moving, and leave a good impression.",need:0,
 article:[
 {t:"A first impression takes seconds. Most of it is not what you say, but how relaxed you seem: open posture, eye contact, and a real smile. Start with something about the shared setting, like the coffee line, the class, or the music. It lowers the pressure for both of you."},
 {q:"Which opener works best at a coffee shop?",o:["You're really pretty.","That pastry looks great. Have you tried it?","Do you have a boyfriend?"],a:1,why:"Commenting on a shared situation is low pressure and easy to answer."},
 {t:"Good small talk follows a simple loop: ask, listen, then share something of your own. Open-ended questions ('What got you into that?') invite stories. Yes/no questions end the conversation."},
 {q:"She says she just got back from a trip. Your best follow-up?",o:["Cool.","What was the best part?","I went somewhere better once."],a:1,why:"Open-ended questions show interest and give her room to talk."}],
 scen:"You're in line at a campus coffee shop. A girl in front of you is holding a book you've heard of. Start a conversation.",
 ai:["Oh, hi! Yeah, I'm only halfway through it.","Ha, thanks. I picked it up for a class, but I'm actually enjoying it.","It's been a long week, so this coffee is much needed."],
 tasks:[[1,"Make eye contact and smile at 3 strangers today."],[2,"Say 'hi' or give a compliment on something she's wearing or doing to a stranger."],[3,"Ask a cashier or barista an open-ended question about their day."],[5,"Start a 2-minute conversation with someone in your class."],[7,"Ask someone for a recommendation (food, show, music) and follow up on their answer."]]},
{id:2,title:"Texting and keeping the spark",over:"Write texts that are easy to answer and lead to a date.",need:8,
 article:[
 {t:"Good texts are short, specific, and give her something to respond to. Reference something she said, add a little humor, and end with a question or a plan. Avoid long walls of text and constant 'hey' messages."},
 {q:"Which text is the best follow-up after meeting someone?",o:["hey","It was fun meeting you at the coffee shop. What's the book called again?","Why haven't you texted me back?"],a:1,why:"It's specific, warm, and gives her something to answer."}],
 scen:"You met a girl named Maya at a study group. You got her number. Send her a first text.",
 ai:["Haha, hi! Good to hear from you.","That sounds fun, I'm in.","Sure, what did you have in mind?"],
 tasks:[[2,"Text a friend something specific that references your last conversation."],[4,"Send a text with an open-ended question to someone you've met recently."],[6,"Suggest a specific plan (time + place) to a friend."]]},
{id:3,title:"Planning a first date",over:"Pick a fun, low-pressure date and make the ask.",need:20,article:[],scen:"",ai:[],tasks:[]}];
const SURVEY1=[
["When you meet someone new, you usually…",["Start talking right away","Wait for them to talk first","Avoid it if I can"]],
["Your last conversation with a girl you liked went…",["Great","Okay but awkward","I haven't had one"]],
["How do you feel about being rejected?",["I shrug it off","It stings for days","I avoid situations where it could happen"]]];
const ACTIONS=["Starting conversations","Texting","Planning dates","Asking someone out","Listening","Making jokes","Handling rejection","Following up after a date"];
const GOALS=["Talking to a girl","Asking a girl out","Securing second dates","Getting a girlfriend","Building confidence","Writing a better dating profile"];
const S={screen:"auth",tab:"lessons",lesson:null,step:0,done:{},ref:{},stars:{},s1:[],str:[],weak:[],goal:null,prio:["Small talk","Date planning","Texting","Dating profile","Confidence","Handling rejection"],chat:[],chatN:0,fb:null,qans:{},curTask:null,rating:0};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const total=()=>Object.values(S.stars).reduce((a,b)=>a+b,0);
const lstars=id=>S.stars[id]||0;
const unlocked=l=>l.id===1||lstars(l.id-1)>=LESSONS[l.id-1].need&&lstars(l.id-1)>0||lstars(l.id-1)>=LESSONS[l.id-1].need&&LESSONS[l.id-1].need>0;
const unlockedL=l=>l.id===1||lstars(l.id-1)>=l.need;
const go=(s,x={})=>{Object.assign(S,x,{screen:s});render();scrollTo(0,0)};
function nav(){return `<div class="tabs"><button class="${S.tab==='lessons'?'on':''}" onclick="go('home',{tab:'lessons'})">Lessons</button><button class="${S.tab==='tasks'?'on':''}" onclick="go('tasks',{tab:'tasks'})">Tasks</button></div>`}
function bar(label,v,max){return `<div class="muted" style="margin-bottom:4px">${label}</div><div class="prog"><i style="width:${Math.min(100,v/max*100)}%"></i></div>`}
function nextLocked(){return LESSONS.find(l=>!unlockedL(l))}
const V={
auth(){return `<h1>First Words</h1><p>A step-by-step course in talking to women, planning dates, and feeling at ease while you do it.</p>
<div class="card"><div class="row" style="margin-bottom:8px"><button class="opt ${S.mode!=='in'?'sel':''}" onclick="S.mode='up';render()">Sign up</button><button class="opt ${S.mode==='in'?'sel':''}" onclick="S.mode='in';render()">Log in</button></div>
<label for="em">Email</label><input id="em" type="email" autocomplete="email">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<p style="margin-top:16px"><button class="btn" style="width:100%" onclick="go(S.mode==='in'?'home':'s1')">${S.mode==='in'?'Log in':'Create account'}</button></p>
<p class="muted">Prototype: any input works.</p></div>`},
s1(){return `<div class="top"><h2>About you</h2><span class="muted">1 of 5</span></div>${bar('',1,5)}<br>`+SURVEY1.map((q,i)=>`<div class="card"><h3>${q[0]}</h3>${q[1].map((o,j)=>`<button class="opt ${S.s1[i]===j?'sel':''}" onclick="S.s1[${i}]=${j};render()">${o}</button>`).join('')}</div>`).join('')+`<button class="btn" ${S.s1.filter(x=>x!=null).length<3?'disabled':''} onclick="go('s2')">Next page</button>`},
s2(){const pill=(a,z)=>`<span class="pill" draggable="true" ondragstart="event.dataTransfer.setData('t','${a}')" onclick="pick('${a}')">${a}</span>`;
 const free=ACTIONS.filter(a=>!S.str.includes(a)&&!S.weak.includes(a));const n=S.str.length+S.weak.length;
 return `<div class="top"><h2>Strengths and weaknesses</h2><span class="muted">2 of 5</span></div>${bar('',2,5)}
<p style="margin-top:14px">Choose 6 actions and place each one where it fits. Drag it, or tap it to move it between columns. You need at least 1 strength.</p>
<div class="bank">${free.map(a=>pill(a)).join('')||'<span class="muted">All placed</span>'}</div>
<div class="tcols"><div class="zone str" ondragover="event.preventDefault()" ondrop="drop(event,'str')"><h3>Strengths</h3>${S.str.map(pill).join('')}</div><div class="zone weak" ondragover="event.preventDefault()" ondrop="drop(event,'weak')"><h3>Weaknesses</h3>${S.weak.map(pill).join('')}</div></div>
<p class="muted" style="margin-top:10px">${n} of 6 placed</p><button class="btn" ${n<6||!S.str.length?'disabled':''} onclick="go('s3')">Next page</button>`},
s3(){return `<div class="top"><h2>Your main goal</h2><span class="muted">3 of 5</span></div>${bar('',3,5)}<br>`+GOALS.map(g=>`<button class="opt ${S.goal===g?'sel':''}" onclick="S.goal='${g}';render()">${g}</button>`).join('')+`<p style="margin-top:14px"><button class="btn" ${S.goal?'':'disabled'} onclick="go('s4')">Next page</button></p>`},
s4(){return `<div class="top"><h2>Order your lessons</h2><span class="muted">4 of 5</span></div>${bar('',4,5)}<p style="margin-top:14px">Put what you want to learn first at the top.</p>`+S.prio.map((p,i)=>`<div class="row"><span class="opt" style="cursor:default">${i+1}. ${p}</span><button class="mini" aria-label="Move up" onclick="mv(${i},-1)">▲</button><button class="mini" aria-label="Move down" onclick="mv(${i},1)">▼</button></div>`).join('')+`<p style="margin-top:14px"><button class="btn" onclick="go('s5')">Next page</button></p>`},
s5(){return `<div class="top"><h2>You're ready</h2><span class="muted">5 of 5</span></div>${bar('',5,5)}<div class="card" style="margin-top:16px"><h1>Nice work.</h1><p>Your goal is <b>${esc(S.goal||'getting started')}</b>. Your first lesson is built around it. Take it one small step at a time.</p><button class="btn" onclick="go('home')">Go to my lessons</button></div>`},
home(){const nl=nextLocked();let h=nav();
 if(nl)h+=`<div class="hero"><h3 style="margin:0 0 8px">${Math.max(0,nl.need-lstars(nl.id-1))} more stars to unlock "${nl.title}"</h3>${bar('',lstars(nl.id-1),nl.need)}</div>`;
 LESSONS.forEach(l=>{const ul=unlockedL(l),cur=ul&&!(nl&&false)&&(!LESSONS[l.id]||!unlockedL(LESSONS[l.id]));
 h+=`<button class="card lesson ${ul?(cur?'cur':'done'):'locked'}" ${ul?`onclick="startLesson(${l.id})"`:'disabled'}><span class="chip ${cur?'now':''}">${ul?(cur?'Current lesson':'Completed'):'Locked'}</span><h3 style="margin-top:8px">Lesson ${l.id}: ${l.title}</h3><p class="muted">${l.over}</p>${ul?`<span class="stars">★ ${lstars(l.id)} earned</span>`:`<span class="muted">Earn ${l.need} stars in Lesson ${l.id-1} to unlock</span>`}</button>`});
 return h},
article(){const l=S.lesson,i=S.step,it=l.article[i];const last=i===l.article.length-1;let h=`<div class="top"><button class="mini" style="width:auto;padding:0 12px" onclick="go('home')">Back</button><span class="muted">${l.title}</span></div>${bar('',i+1,l.article.length)}<div class="card" style="margin-top:16px">`;
 if(it.t)h+=`<p>${it.t}</p><button class="btn" onclick="S.step++;render()">${last?'Finish reading':'Continue'}</button>`;
 else{const a=S.qans[i];h+=`<h3>${it.q}</h3>`+it.o.map((o,j)=>`<button class="opt ${a!=null?(j===it.a?'right':(j===a?'wrong':'')):''}" ${a!=null?'disabled':''} onclick="S.qans[${i}]=${j};render()">${o}</button>`).join('');
 if(a!=null)h+=`<p class="muted" style="margin-top:10px">${a===it.a?'Correct. ':'Not quite. '}${it.why}</p><button class="btn" onclick="${last?`startPractice()`:`S.step++;render()`}">${last?'Go to practice':'Continue'}</button>`}
 return h+'</div>'},
practice(){const l=S.lesson;return `<div class="top"><h2>Practice</h2></div><div class="card"><h3>Scenario</h3><p>${l.scen}</p></div><div class="chat">${S.chat.map(m=>`<div class="b ${m.r}">${esc(m.t)}</div>`).join('')}</div>
${S.fb?`<div class="fb"><h3>Feedback</h3>${S.fb}</div><div class="row"><button class="btn ghost" onclick="startPractice()">Try again</button><button class="btn" onclick="go('ltasks')">Move on to tasks</button></div>`:`<textarea id="msg" rows="2" placeholder="Type your reply…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><p style="margin-top:10px"><button class="btn" onclick="send()">Send</button> <button class="btn ghost" onclick="finish()" ${S.chatN<2?'disabled':''}>End and get feedback</button></p>`}`},
ltasks(){const l=S.lesson,nl=nextLocked();return `<div class="top"><h2>Lesson tasks</h2></div>${nl?`<div class="hero"><h3 style="margin:0 0 8px">${Math.max(0,nl.need-lstars(nl.id-1))} more stars to unlock the next lesson</h3>${bar('',lstars(nl.id-1),nl.need)}</div>`:''}${taskList([l])}<p><button class="btn" onclick="go('home',{tab:'lessons'})">Back to home</button></p>`},
tasks(){const nl=nextLocked();const ls=LESSONS.filter(unlockedL).reverse();return nav()+(nl?`<div class="hero"><h3 style="margin:0 0 8px">${Math.max(0,nl.need-lstars(nl.id-1))} more stars to unlock "${nl.title}"</h3>${bar('',lstars(nl.id-1),nl.need)}</div>`:'')+`<div class="card" style="border:2px solid var(--gold)"><span class="chip now">Task of the day</span><h3 style="margin-top:8px">Pay one genuine compliment on someone's effort, not their looks.</h3><button class="btn" onclick="openTask(0,0,2,true)">Mark as done (2 ★)</button></div>`+taskList(ls)},
reflect(){const t=S.curTask,w=(S.ref.txt||'').trim().split(/\s+/).filter(Boolean).length;const r=S.rating;
 const st=[1,2,3,4,5].map(n=>`<span><span style="color:${r>=n?'var(--gold)':'var(--lock)'}">★</span>${r===n-.5?'<span style="position:absolute;left:0;top:0;width:.5em;overflow:hidden;color:var(--gold)">★</span>':''}<b class="l" onclick="S.rating=${n-.5};render()" role="button" aria-label="${n-.5} stars"></b><b class="r" onclick="S.rating=${n};render()" role="button" aria-label="${n} stars"></b></span>`).join('');
 return `<div class="top"><h2>Reflection</h2></div><div class="card"><p class="muted">${esc(t.text)}</p><label>How did it go?</label><div class="star-in" aria-live="polite">${st}</div><span class="muted"> ${r?r+' / 5':''}</span>
<label for="rt">What happened and how did it make you feel?</label><textarea id="rt" rows="7" oninput="S.ref.txt=this.value;document.getElementById('wc').textContent=this.value.trim().split(/\\s+/).filter(Boolean).length+' / 100 words';document.getElementById('sb').disabled=!(S.rating&&this.value.trim().split(/\\s+/).filter(Boolean).length>=100)">${esc(S.ref.txt||'')}</textarea>
<p class="muted" id="wc">${w} / 100 words</p><button id="sb" class="btn" ${r&&w>=100?'':'disabled'} onclick="submitRef()">Submit reflection</button></div>`}};
function taskList(ls){let h='';ls.forEach(l=>{const all=l.tasks.map((t,i)=>({d:t[0],text:t[1],i,l,k:l.id+'-'+i}));
 all.filter(x=>!S.done[x.k]).sort((a,b)=>a.d-b.d).forEach(x=>h+=`<button class="card task" onclick="openTask(${l.id-1},${x.i})"><span class="d">${x.d}</span><span>${x.text}<br><span class="muted">Lesson ${l.id} · ${x.d} ★</span></span></button>`);
 all.filter(x=>S.done[x.k]).forEach(x=>h+=`<div class="card task done"><span class="d">✓</span><span>${x.text}</span></div>`)});
 return h||'<p class="muted">No tasks yet.</p>'}
function pick(a){if(S.str.includes(a)){S.str=S.str.filter(x=>x!==a);S.weak.push(a)}else if(S.weak.includes(a)){S.weak=S.weak.filter(x=>x!==a);}else if(S.str.length+S.weak.length<6)S.str.push(a);render()}
function drop(e,z){e.preventDefault();const a=e.dataTransfer.getData('t');if(!a)return;S.str=S.str.filter(x=>x!==a);S.weak=S.weak.filter(x=>x!==a);if(S.str.length+S.weak.length<6)S[z].push(a);render()}
function mv(i,d){const j=i+d;if(j<0||j>=S.prio.length)return;[S.prio[i],S.prio[j]]=[S.prio[j],S.prio[i]];render()}
function startLesson(id){const l=LESSONS[id-1];if(!l.article.length)return;go('article',{lesson:l,step:0,qans:{}})}
function startPractice(){go('practice',{chat:[{r:'ai',t:'(Scenario begins. Say something to start.)'}],chatN:0,fb:null})}
function send(){const v=$('msg').value.trim();if(!v)return;S.chat.push({r:'me',t:v});S.chat.push({r:'ai',t:S.lesson.ai[Math.min(S.chatN,S.lesson.ai.length-1)]});S.chatN++;render()}
function finish(){const mine=S.chat.filter(m=>m.r==='me').map(m=>m.t),q=mine.some(t=>t.includes('?')),len=mine.reduce((a,t)=>a+t.length,0)/mine.length>25;
 S.fb=`<p>${q?'You asked a question, which keeps her talking. That was a strong move.':'Try ending a message with a question. It makes replying easy for her.'}</p><p>${len?'Your messages had good detail.':'Add a little more detail, like what you noticed or why you asked.'}</p><p>Overall, you showed up and kept the conversation going. That's the hardest part.</p>`;render()}
function openTask(li,i,d,daily){const t=daily?{text:"Pay one genuine compliment on someone's effort, not their looks.",d:2,key:'daily',lid:0}:{text:LESSONS[li].tasks[i][1],d:LESSONS[li].tasks[i][0],key:(li+1)+'-'+i,lid:li+1};S.ref={};S.rating=0;go('reflect',{curTask:t})}
function submitRef(){const t=S.curTask;S.done[t.key]=1;if(t.lid)S.stars[t.lid]=lstars(t.lid)+t.d;go('tasks',{tab:'tasks'})}
function render(){$('app').innerHTML=V[S.screen]()}
render();
</script></body></html>
