<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supabase Sign Up</title>
    <!-- Load Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Sign Up (Database Table)</h2>
    <form id="signup-form">
        <div>
            <label for="email">Email:</label><br>
            <input type="email" id="email" required>
        </div>
        <br>
        <div>
            <label for="password">Password:</label><br>
            <input type="password" id="password" required>
        </div>
        <br>
        <button type="submit">Register</button>
    </form>
    <br>
    <p id="status-message"></p>

    <!-- Recent sign-ups section -->
    <h3>Recent sign-ups because privacy doesn't matter lol</h3>
    <ul id="recent-list">
        <!-- Emails will be injected here -->
    </ul>

    <script>
        const SUPABASE_URL = 'https://bzqepyhnvvrwzafydeqp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_VbXs3R4Y6H4bVS63j2KkoA_g0trAUp5';

        const testDatabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('signup-form');
        const statusMessage = document.getElementById('status-message');
        const recentList = document.getElementById('recent-list');

        // Function to fetch and display the last 3 sign-ups
        async function loadRecentSignUps() {
            const { data, error } = await testDatabase
                .from('SIGN_IN') // Change to your actual table name if different
                .select('email')
                .order('user_id', { ascending: false }) // Sort by newest (assuming 'id' auto-increments)
                .limit(3);

            if (error) {
                console.error("Error fetching recent signups:", error);
                return;
            }

            // Clear the list before repopulating
            recentList.innerHTML = '';

            // Loop through the data and add each email to the list
            data.forEach(user => {
                const li = document.createElement('li');
                li.textContent = user.email;
                recentList.appendChild(li);
            });
        }

        // Load the recent sign-ups when the page first loads
        loadRecentSignUps();

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const emailInput = document.getElementById('email').value;
            const passwordInput = document.getElementById('password').value;

            statusMessage.textContent = "Submitting...";
            statusMessage.style.color = "blue";

            const { data, error } = await testDatabase
                .from('SIGN_IN')
                .insert([
                    { email: emailInput, password_hash: passwordInput }
                ]);

            if (error) {
                statusMessage.textContent = `Error: ${error.message}`;
                statusMessage.style.color = 'red';
                console.error("Insert error:", error);
            } else {
                statusMessage.textContent = 'User saved to database successfully!';
                statusMessage.style.color = 'green';
                form.reset();
                
                // Refresh the recent sign-ups list immediately
                loadRecentSignUps();
            }
        });
    </script>
</body>
</html>
